[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldcup-ranker"
version = "0.1.0"
description = "Pre-tournament strength ranking for the FIFA World Cup using free public data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "worldcup-ranker contributors" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.25",
    "pydantic>=2.5",
    "matplotlib>=3.7",
    "requests>=2.31",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
worldcup-ranker = "worldcup_ranker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
